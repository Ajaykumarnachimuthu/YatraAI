name: Yatra AI Full-Stack CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-backend:
    name: Test ML Core & Backend Service
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Complete Test Suite
      env:
        DATABASE_URL: "sqlite:///./ci_test.db"
        JWT_SECRET_KEY: "ci_pipeline_secret_test_key_for_automated_testing"
      run: |
        python -m unittest discover -s tests

  build-frontend:
    name: Build React Full-Stack Frontend
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Compile & Typecheck Frontend Bundle
      working-directory: ./frontend
      run: npm run build

