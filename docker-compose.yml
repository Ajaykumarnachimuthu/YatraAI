version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yatra-ai-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg2://yatra_user:yatra_secure_password@postgres:5432/yatra_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=yatra_ai_super_secret_jwt_key_production_grade_32_bytes_min
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost:8000"]
      - DECISION_THRESHOLD=0.30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yatra-net

  postgres:
    image: postgres:16-alpine
    container_name: yatra-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yatra_user
      POSTGRES_PASSWORD: yatra_secure_password
      POSTGRES_DB: yatra_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U yatra_user -d yatra_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yatra-net

  redis:
    image: redis:7-alpine
    container_name: yatra-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yatra-net

networks:
  yatra-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:

