dataset: data/synthetic/choice_dataset.parquet
excluded_identifiers:
- traveller_id
- session_id
- alternative_id
- service_identifier
- source_record_id
- source_dataset
excluded_leakage_features:
- choice_probability
- utility
- rank
feature_configurations:
  core_features_count: 28
  extended_features_count: 29
models_evaluated:
- LogisticRegression(max_iter=1000)
- DecisionTreeClassifier(max_depth=10, min_samples_leaf=20)
- RandomForestClassifier(n_estimators=100, max_depth=12, min_samples_leaf=10)
- HistGradientBoostingClassifier(max_iter=100, max_depth=8, min_samples_leaf=20)
partition_strategy: traveller_level_group_split
random_seed: 42
ratios:
  test: 0.15
  train: 0.7
  val: 0.15
target: chosen
total_rows: 138603
unique_travellers: 5000
